version: "3.8"

services:
  ulpf:
    build:
      context: .
      dockerfile: Dockerfile
    image: ulpf:latest
    container_name: ulpf-soc-console
    restart: unless-stopped
    ports:
      - "8080:8080/tcp"    # Web Dashboard & REST API
      - "5140:5140/udp"    # Wire Syslog UDP Intake Socket
    volumes:
      - ./data:/app/data   # Persist raw forensic and OCSF batch archives
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/stats"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

vendor: "pfSense / Suricata"
product: "Suricata & Filterlog"
version: "1.1.0"
description: "pfSense Perimeter Firewall and Suricata IDS/IPS JSON/CSV Parser"

signature_match:
  type: "regex"
  patterns:
    - '"event_type":\s*"(?:alert|flow|dns|http|tls)"'
    - 'filterlog\[\d+\]:'
    - 'filterlog:'

extraction:
  type: "json_or_regex"
  # JSON field mappings
  json_fields:
    src_ip: "src_ip"
    src_port: "src_port"
    dst_ip: "dest_ip"
    dst_port: "dest_port"
    proto: "proto"
    action: "alert.action"
    event_type: "event_type"
  # Regex fallback for pfSense filterlog CSV
  patterns:
    - 'filterlog\[?\d*\]?:\s+.*?,(?P<action>pass|block),in,\d+,.*?,\d+,(?P<proto>tcp|udp|icmp),\d+,(?P<src_ip>[\d\.]+),(?P<dst_ip>[\d\.]+),(?P<src_port>\d+),(?P<dst_port>\d+)'

field_mapping:
  class_uid: 4001
  category_uid: 4
  activity_id: 1
  src_endpoint.ip: "$src_ip"
  src_endpoint.port: "$src_port:integer"
  dst_endpoint.ip: "$dst_ip"
  dst_endpoint.port: "$dst_port:integer"
  connection_info.protocol_name: "$proto:upper"
  metadata.product.vendor_name: "pfSense / Suricata"
  metadata.product.name: "Suricata & Filterlog"

disposition_map:
  pass: "Allowed"
  allowed: "Allowed"
  block: "Blocked"
  blocked: "Blocked"
  drop: "Blocked"
  dropped: "Blocked"
  alert: "Alert"
  default: "Unknown"

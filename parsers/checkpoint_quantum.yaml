vendor: CheckPoint
product: Quantum
version: 1.0.0
description: Automated OCSF Parser for CheckPoint Quantum
signature_match:
  type: contains
  patterns:
  - CP-QUANTUM-01
extraction:
  type: regex
  patterns:
  - (?P<action>ALLOW|ALLOWED|PERMIT|DENY|DENIED|DROP|DROPPED|BLOCK|BLOCKED).*?(?P<src_ip>\d{1,3}(?:\.\d{1,3}){3})[^\d]+(?P<src_port>\d{1,5})[^\d]+(?P<dst_ip>\d{1,3}(?:\.\d{1,3}){3})[^\d]+(?P<dst_port>\d{1,5})
field_mapping:
  class_uid: 4001
  category_uid: 4
  activity_id: 1
  src_endpoint.ip: $src_ip
  src_endpoint.port: $src_port:integer
  dst_endpoint.ip: $dst_ip
  dst_endpoint.port: $dst_port:integer
  connection_info.protocol_name: TCP
  disposition: $action
disposition_map:
  allow: Allowed
  allowed: Allowed
  permit: Allowed
  deny: Blocked
  denied: Blocked
  drop: Blocked
  dropped: Blocked
  block: Blocked
  blocked: Blocked

[package]
name = "ulpf-core-engine"
version = "1.1.0"
edition = "2021"
authors = ["ULPF Engineering Team <security@gov.in>"]
description = "Universal Log Pre-processing Framework (ULPF) High-Throughput Ingestion Daemon"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
sha2 = "0.10"
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
arrow = { version = "51.0", features = ["ipc"] }
parquet = { version = "51.0", features = ["arrow"] }
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
maxminddb = "0.24"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
